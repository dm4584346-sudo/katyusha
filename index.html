<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для Катюши 💐</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#09090b;color:#eee;font-family:"Courier New",monospace}
  body{background:radial-gradient(ellipse at 50% 38%,#1c1519 0%,#0c0b0d 55%,#060607 100%)}
  #corner{position:fixed;top:14px;left:18px;font-weight:bold;font-size:14px;color:#cfc8bd;opacity:.85;letter-spacing:.04em}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #stage{position:relative;cursor:pointer}
  canvas{display:block}
  #glow{position:absolute;left:0;top:0;filter:blur(9px) saturate(1.5);opacity:.6;pointer-events:none}
  #c{position:relative}
  #txt{text-align:center;margin-top:1vh;min-height:16vh}
  .sub{font-weight:bold;letter-spacing:.3em;font-size:clamp(10px,1.7vh,15px);color:#ece6d8;text-transform:uppercase;min-height:1.4em}
  .name{font-family:"Trebuchet MS",Verdana,sans-serif;font-weight:bold;font-size:clamp(32px,7vh,68px);line-height:1.25;
        background:linear-gradient(90deg,#ff8fc4,#ffd6ea,#ff6fae,#ffb3d6,#ff8fc4);background-size:300% 100%;
        -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;
        filter:drop-shadow(0 0 14px rgba(255,110,175,.45));opacity:0;transform:translateY(10px) scale(.96);transition:opacity 1.4s ease,transform 1.4s ease,letter-spacing 2s ease;letter-spacing:.5em}
  .name.on{opacity:1;transform:none;letter-spacing:.02em}
  .wish{font-weight:bold;font-size:clamp(12px,2.1vh,19px);color:#f3eee6;min-height:1.4em}
  .cur{display:inline-block;animation:blink 1s steps(1) infinite;color:#fff}
  #hint{position:fixed;bottom:12px;width:100%;text-align:center;font-size:12px;color:#8d8790;opacity:0;transition:opacity 2s}
  #hint.on{opacity:.7}
  @keyframes shine{to{background-position:300% 0}}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="corner">♡ маленький подарок</div>
<div id="wrap">
  <div id="stage"><canvas id="glow"></canvas><canvas id="c"></canvas></div>
  <div id="txt">
    <div class="sub" id="sub"></div>
    <div class="name" id="name"></div>
    <div class="wish"><span id="wish"></span><span class="cur">_</span></div>
  </div>
</div>
<div id="hint">нажми на букет, чтобы собрать его заново ✿</div>

<script>
/* ====== Тексты — можно поменять ====== */
const NAME = 'Катюша';
const SUB  = 'цветы, которые не завянут';
const WISH = 'для самой прекрасной девушки ♡';
/* ===================================== */

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const gv=document.getElementById('glow'),gtx=gv.getContext('2d');
const COLS=104,UW=100/COLS,UH=UW*1.7,ROWS=Math.floor(124/UH),DUR=1.5;
const SCR='@#%&*+=-:;/\\|xo0~';
const hash=(a,b)=>{const h=Math.sin(a*127.1+b*311.7)*43758.5453;return h-Math.floor(h)};
const pick=(s,v)=>s[Math.floor(v*s.length)%s.length];
const ease=e=>1-Math.pow(1-e,3);
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;let t=((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function inTri(px,py,a,b,c){const d=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);const l1=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/d;const l2=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/d;return l1>=0&&l2>=0&&1-l1-l2>=0}

// Цветы: 0 розовая ромашка, 1 белая ромашка, 2 красная роза, 3 жёлтая гвоздика, 4 розовый круглый, 5 фиолетовая, 6 жёлтая гвоздика
const F=[
 {x:30,y:24,R:13,type:'daisy',n:9, h:322,s:90,l:72,ce:[48,100,55]},
 {x:55,y:15,R:12,type:'daisy',n:10,h:48, s:80,l:88,ce:[45,100,55]},
 {x:74,y:29,R:11.5,type:'rose',     h:0,  s:90,l:55},
 {x:21,y:47,R:12,type:'carn',       h:44, s:100,l:55},
 {x:49,y:45,R:12.5,type:'round',    h:340,s:85,l:72},
 {x:69,y:55,R:10,type:'daisy',n:10, h:262,s:80,l:72,ce:[48,100,55]},
 {x:83,y:50,R:10,type:'carn',       h:46, s:100,l:55},
];
const ORDER=[4,5,6,3,2,0,1];
const RANK={1:0,0:1,2:2,3:3,6:4,5:5,4:6};
const LEAVES=[{x:32,y:74,rx:11,ry:24,a:-0.45},{x:68,y:74,rx:11,ry:24,a:0.45},{x:24,y:64,rx:8,ry:16,a:-0.9},{x:77,y:64,rx:8,ry:16,a:0.9}];

function sFlower(f,i,x,y,c,r){
  const dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy); if(d>f.R*1.05) return null;
  const th=Math.atan2(dy,dx),hv=hash(c,r),k=d/f.R; let rr,ch,h=f.h,s=f.s,l=f.l;
  if(f.type==='daisy'){
    const p=Math.abs(Math.cos(f.n*th/2)); rr=f.R*(0.6+0.4*Math.pow(p,0.5)); if(d>rr) return null;
    if(k<0.3){[h,s,l]=f.ce; l+=(hv-.5)*14; ch=pick('@#%8',hv);}
    else {l-=(1-p)*18+(hv-.5)*8; ch=d>rr-1.1?pick('.:',hv):pick('oO0@%*',hv);}
  } else if(f.type==='rose'){
    rr=f.R*(0.93+0.07*Math.sin(5*th)); if(d>rr) return null;
    const sw=Math.sin(d*1.3+th*2); l+=sw*9+(hv-.5)*6; ch=sw>0.6?pick('=-',hv):pick('#@%&',hv);
    if(Math.abs(dx-1)<1.4&&Math.abs(dy-1.5)<1.4){h=15;s=100;l=82;ch='#';}
  } else if(f.type==='carn'){
    rr=f.R*(0.82+0.12*Math.sin(11*th+1)*Math.cos(7*th)+0.06*Math.sin(23*th)); if(d>rr) return null;
    l+=Math.sin(y*2.1+x*0.4)*10+(hv-.5)*8; ch=pick('=~-:#',hv);
  } else {
    rr=f.R; if(d>rr) return null;
    if(k<0.17){h=25;s=100;l=80;ch='#';} else {l+=Math.sin(d*1.4)*6+(hv-.5)*6; ch=d>rr-1?pick('.:',hv):pick('ooO0@',hv);}
  }
  return {ch,h,s,l,g:'f',fi:i,d,th,cx:f.x,cy:f.y,R:f.R};
}
function sBow(x,y,hv){
  const col={h:345,s:90,l:76+(hv-.5)*8,g:'b'};
  if(Math.abs(x-50)<1.6&&Math.abs(y-102)<2.3) return {...col,ch:'#',l:68};
  if(Math.abs(y-102)<1.8&&Math.abs(x-50)<10.5) return {...col,ch:'='};
  for(const s of [-1,1]){
    const ex=(x-(50+s*6))/5.5,ey=(y-101)/3.2,q=ex*ex+ey*ey; if(q<1&&q>0.35) return {...col,ch:'='};
    if(segDist(x,y,50+s,103,50+s*6,111)<1.1) return {...col,ch:s<0?'/':'\\',l:70};
  }
  return null;
}
function sample(x,y,c,r){
  const hv=hash(c,r);
  const b=sBow(x,y,hv); if(b) return b;
  for(const i of ORDER){const p=sFlower(F[i],i,x,y,c,r); if(p) return p;}
  if(inTri(x,y,[35,66],[65,66],[50,104])) return {ch:c%3===0?'|':(r%2?'=':'-'),h:95,s:30,l:76+(hv-.5)*10,g:'w'};
  for(const f of F){ if(segDist(x,y,f.x,f.y+f.R*0.5,50,98)<0.75) return {ch:Math.abs(f.x-50)<6?'|':(f.x<50?'\\':'/'),h:110,s:70,l:46+hv*10,g:'s'}; }
  for(const L of LEAVES){
    const ca=Math.cos(L.a),sa=Math.sin(L.a),dx=x-L.x,dy=y-L.y,u=dx*ca+dy*sa,v=-dx*sa+dy*ca;
    const q=u*u/(L.rx*L.rx)+v*v/(L.ry*L.ry);
    if(q<1){const vein=Math.abs(u)<0.8; return {ch:vein?(L.a<0?'\\':'/'):(((c+r)%3===0)?'/':'x'),h:92+hv*12,s:85,l:(vein?40:53)+(hv-.5)*10-q*8,g:'l'};}
  }
  for(const e of [[44,117],[47,118],[50,119],[53,118],[56,117]]){ if(segDist(x,y,50,103,e[0],e[1])<0.6) return {ch:e[0]<50?'/':e[0]>50?'\\':'|',h:105,s:70,l:50,g:'s'}; }
  return null;
}

const P=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const x=(c+.5)*UW,y=(r+.5)*UH,s=sample(x,y,c,r); if(!s) continue;
  P.push({...s,x,y,hv:hash(c+7,r+3),ox:0,oy:0,vx:0,vy:0,sx:0,sy:0,delay:0});
}
const SP=[];
while(SP.length<34){const x=6+Math.random()*88,y=3+Math.random()*80;
  if(!sample(x,y,Math.floor(x/UW),Math.floor(y/UH))) SP.push({x,y,ch:pick('+*·✦.',Math.random()),sp:0.8+Math.random()*2,ph:Math.random()*6.3});}

let t0=0,textShown=false,timers=[];
function assemble(){
  for(const p of P){
    const hv=Math.random();
    switch(p.g){
      case 'l': p.delay=0.1+hv*0.7+(1-p.y/110)*0.3; break;
      case 's': p.delay=0.6+hv*0.5; break;
      case 'w': p.delay=1.0+(p.y-66)/38*0.6+hv*0.2; break;
      case 'f': p.delay=1.5+RANK[p.fi]*0.22+(p.d/p.R)*0.7+hv*0.1; break;
      case 'b': p.delay=3.0+hv*0.4; break;
    }
    const a=Math.random()*Math.PI*2,rad=75+Math.random()*70;
    p.sx=50+Math.cos(a)*rad; p.sy=(p.g==='b'?140+Math.random()*30:60+Math.sin(a)*rad);
    p.ox=p.oy=p.vx=p.vy=0;
  }
  t0=performance.now(); textShown=false;
  timers.forEach(clearTimeout); timers=[];
  document.getElementById('sub').textContent='';
  document.getElementById('wish').textContent='';
  const nm=document.getElementById('name'); nm.classList.remove('on'); nm.textContent=NAME;
  document.getElementById('hint').classList.remove('on');
}
function typeText(el,str,speed,done){let i=0;(function step(){el.textContent=str.slice(0,++i);if(i<str.length)timers.push(setTimeout(step,speed));else if(done)done();})();}
function showText(){
  textShown=true;
  typeText(document.getElementById('sub'),SUB,55,()=>{
    document.getElementById('name').classList.add('on');
    timers.push(setTimeout(()=>typeText(document.getElementById('wish'),WISH,60,()=>document.getElementById('hint').classList.add('on')),1100));
  });
}

let W,H,scale,fs;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.min(innerWidth*0.96,innerHeight*0.72*100/124); H=W*1.24; scale=W/100; fs=UH*scale*0.95;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  gv.width=W*0.5;gv.height=H*0.5;gv.style.width=W+'px';gv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);

const ptr={x:-99,y:-99,on:false};
const stage=document.getElementById('stage');
stage.addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect();ptr.x=(e.clientX-b.left)/scale;ptr.y=(e.clientY-b.top)/scale;ptr.on=true;});
stage.addEventListener('pointerleave',()=>{ptr.on=false;});
stage.addEventListener('click',assemble);

function frame(now){
  const t=(now-t0)/1000,T=now/1000;
  ctx.clearRect(0,0,W,H);
  ctx.font=`bold ${fs}px "Courier New",monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const wave=(T*30)%280-70;
  for(const p of P){
    const e=(t-p.delay)/DUR; if(e<=0) continue;
    let x,y,ch=p.ch,alpha=1;
    if(e<1){
      const k=ease(e); alpha=Math.min(1,e*3);
      if(p.g==='f'){const rad=p.d*k,ang=p.th-(1-k)*2.4;x=p.cx+Math.cos(ang)*rad;y=p.cy+Math.sin(ang)*rad;}
      else {x=p.sx+(p.x-p.sx)*k;y=p.sy+(p.y-p.sy)*k;}
      if(e<0.85&&Math.random()<0.5) ch=pick(SCR,Math.random());
    } else {
      if(ptr.on){const dx=p.x+p.ox-ptr.x,dy=p.y+p.oy-ptr.y,d2=dx*dx+dy*dy;
        if(d2<81){const d=Math.sqrt(d2)+0.01,f=(9-d)/9*1.1;p.vx+=dx/d*f;p.vy+=dy/d*f;}}
      if(p.vx||p.vy||p.ox||p.oy){
        p.vx=(p.vx-p.ox*0.06)*0.86; p.vy=(p.vy-p.oy*0.06)*0.86; p.ox+=p.vx; p.oy+=p.vy;
        if(Math.abs(p.ox)+Math.abs(p.oy)+Math.abs(p.vx)+Math.abs(p.vy)<0.002){p.ox=p.oy=p.vx=p.vy=0;}
      }
      if(p.g==='f'){const br=1+0.035*Math.sin(T*1.7+p.fi);x=p.cx+(p.x-p.cx)*br;y=p.cy+(p.y-p.cy)*br;}
      else {x=p.x;y=p.y;}
      x+=p.ox;y+=p.oy;
    }
    // покачивание
    if(p.g==='f') x+=Math.sin(T*1.1+p.fi*1.3)*0.9;
    else if(p.g==='s'&&p.y<98) x+=Math.sin(T*1.1)*0.9*(98-p.y)/75;
    else if(p.g==='l') x+=Math.sin(T*0.9+p.y*0.05)*0.35;
    // переливание
    const bd=(p.x+p.y*0.7)-wave,band=Math.exp(-bd*bd/90);
    const l=Math.min(95,p.l+6*Math.sin(T*2.3-(p.x*0.09+p.y*0.06))+band*20);
    const h=p.h+7*Math.sin(T*0.8+p.x*0.05+p.y*0.03);
    ctx.fillStyle=`hsla(${h},${p.s}%,${l}%,${alpha})`;
    ctx.fillText(ch,x*scale,y*scale);
  }
  if(t>1.2){
    for(const s of SP){const a=Math.pow(Math.max(0,Math.sin(T*s.sp+s.ph)),3)*Math.min(1,(t-1.2)/2);
      if(a<0.02) continue; ctx.fillStyle=`hsla(50,100%,90%,${a})`; ctx.fillText(s.ch,s.x*scale,s.y*scale);}
  }
  gtx.clearRect(0,0,gv.width,gv.height); gtx.drawImage(cv,0,0,gv.width,gv.height);
  if(!textShown&&t>4.6) showText();
  requestAnimationFrame(frame);
}
resize(); assemble(); requestAnimationFrame(frame);
</script>
</body>
</html>
